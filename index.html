<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101a1d"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Gefühlslage</title>
<style>
:root{--bg:#f3f5f6;--card:#fff;--tx:#1d2a2e;--mu:#667479;--ac:#2a6f77;--ln:#dde3e5;--pos:#f2a65a;--neu:#b9c7bd;--neg:#7fb0ea;--ink:#14161a}
@media(prefers-color-scheme:dark){:root{--bg:#101a1d;--card:#17252a;--tx:#e8eeef;--mu:#93a3a8;--ac:#6cc0c8;--ln:#26383d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
h2{font-size:26px;margin:4px 0 14px}h3{font-size:18px;margin:0 0 10px}p,.mu{color:var(--mu);font-size:15px}.card p{margin:8px 0}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px}
input[type=range]{padding:0;accent-color:var(--ac)}input[type=checkbox]{width:24px;height:24px}
.row{display:flex;gap:8px;align-items:center}
.b,.seg button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;min-height:48px}
.b.p{background:var(--ac);color:var(--bg);border:0;width:100%;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;color:inherit;background:none;border:2px solid var(--c);border-radius:99px;padding:8px 14px;min-height:44px}
.chip.on{background:var(--c);color:var(--ink)}
.fr{padding:10px 0;border-top:1px solid var(--ln)}.fr input{margin-top:6px}
.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1;padding:10px 4px;min-height:44px}
.seg button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;font:12px inherit;background:none;border:0;color:var(--mu);padding:10px 0;min-height:58px}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:22px}
svg{width:100%;height:auto;display:block}svg text{fill:var(--tx);font-family:inherit}
.bub{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{transform:scale(0)}}@media(prefers-reduced-motion:reduce){.bub{animation:none}}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bar i{display:block;height:12px;border-radius:6px}.warn{background:#f2a65a33;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}
</style></head><body><main></main><div id="toast"></div>
<nav><button data-a="tab" data-t="today"><span>✎</span>Heute</button><button data-a="tab" data-t="cloud"><span>◉</span>Wolke</button><button data-a="tab" data-t="stats"><span>▥</span>Statistik</button><button data-a="tab" data-t="hist"><span>▦</span>Verlauf</button><button data-a="tab" data-t="set"><span>⚙</span>Mehr</button></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=[['sleep','Schlafdauer','n','h'],['sq','Schlafqualität','s'],['sport','Bewegung/Sport','c',['keine','leicht','intensiv']],['out','Draußen/Tageslicht','s'],['soc','Soziale Kontakte (Qualität)','s'],['lone','Einsamkeit','s'],['cp','Konflikt privat','b'],['cw','Konflikt Arbeit','b'],['work','Arbeitstag','c',['frei','wenig','normal','voll']],['stress','Stresslevel','s'],['press','Zeitdruck/Überforderung','s'],['win','Erfolg/Sinn erlebt','b'],['food','Ernährung (Qualität)','s'],['alc','Alkohol','n','Gläser'],['caf','Koffein','n','Getränke'],['scr','Bildschirm/Social Media','n','h'],['wea','Wetter','c',['Regen','bewölkt','sonnig']],['mind','Achtsamkeit/Entspannung','b'],['joy','Freudvolle Aktivität','b'],['pain','Beschwerden/Schmerz/Krankheit','s']].map(([id,n,t,o])=>({id,n,t,o:t=='c'?o:null,u:t=='n'?o:''}));
const OPT=[['cyc','Zyklusphase','s'],['fin','Finanzielle Sorgen','s'],['med','Medikamente genommen','b'],['trip','Reise/Ortswechsel','b'],['nat','Naturaufenthalt','b'],['grat','Dankbarkeit erlebt','b']].map(([id,n,t])=>({id,n,t}));
let db,E={},K={words:{},hidden:OPT.map(f=>f.id),custom:[],hl:30,thr:.3,lastBackup:0},tab='today',cur,pend=null,cl={days:30,tw:true},st={days:90,lag:false};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),addD=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
const req=r=>new Promise(o=>r.onsuccess=()=>o(r.result)),tx=(s,m)=>db.transaction(s,m).objectStore(s);
const putE=e=>req(tx('e','readwrite').put(e)),saveK=()=>req(tx('k','readwrite').put(K,'k'));
const AF=()=>[...F,...OPT,...K.custom].filter(f=>!K.hidden.includes(f.id)),opts=f=>f.t=='b'?['Nein','Ja']:f.t=='s'?['1','2','3','4','5']:f.o;
const col=v=>v>0?'var(--pos)':v<0?'var(--neg)':'var(--neu)',mean=a=>a.reduce((s,x)=>s+x,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))},median=a=>[...a].sort((x,y)=>x-y)[a.length>>1];
const rank=a=>{const s=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]),r=[];for(let i=0;i<s.length;){let j=i;while(j+1<s.length&&s[j+1][0]==s[i][0])j++;for(let k=i;k<=j;k++)r[s[k][1]]=(i+j)/2+1;i=j+1}return r};
const pear=(x,y)=>{const mx=mean(x),my=mean(y);let n=0,a=0,b=0;x.forEach((v,i)=>{n+=(v-mx)*(y[i]-my);a+=(v-mx)**2;b+=(y[i]-my)**2});return a&&b?n/Math.sqrt(a*b):0};
const load=d=>E[d]?JSON.parse(JSON.stringify(E[d])):{date:d,words:[],mood:6,energy:3,f:{},note:''};
const inR=(e,d)=>!d||Date.now()-Date.parse(e.date)<=d*864e5,ents=d=>Object.values(E).filter(e=>inR(e,d)).sort((a,b)=>a.date<b.date?-1:1);
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1600)}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}

/* Gewicht = Σ Intensität · 0.5^(Alter/Halbwertszeit) */
function weights(days,tw){const now=Date.now(),W={};for(const e of ents(days)){const a=Math.max(0,Math.floor((now-Date.parse(e.date))/864e5)),d=tw&&K.hl?.5**(a/K.hl):1;for(const x of e.words){const o=W[x.w]||(W[x.w]={w:x.w,wt:0,n:0});o.wt+=x.i*d;o.n++}}return Object.values(W)}
function pack(items){const mx=Math.max(...items.map(i=>i.wt)),k=80/Math.sqrt(mx),P=[];items.sort((a,b)=>b.wt-a.wt).forEach(it=>{it.r=Math.min(80,Math.max(24,k*Math.sqrt(it.wt)));let t=0;for(it.x=0,it.y=0;P.length&&t<6000;t++){it.x=Math.cos(t*.45)*t*.9;it.y=Math.sin(t*.45)*t*.9;if(P.every(p=>Math.hypot(p.x-it.x,p.y-it.y)>=p.r+it.r+3))break}P.push(it)});return P}
function vCloud(){const W=weights(cl.days,cl.tw).filter(w=>w.wt>=K.thr);let svg='<p>Noch keine Wörter im Zeitraum. Trage zuerst etwas unter „Heute“ ein.</p>';
if(W.length){const P=pack(W),x0=Math.min(...P.map(p=>p.x-p.r))-4,x1=Math.max(...P.map(p=>p.x+p.r))+4,y0=Math.min(...P.map(p=>p.y-p.r))-4,y1=Math.max(...P.map(p=>p.y+p.r))+4;
svg=`<svg viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}">${P.map((p,i)=>`<g class="bub" data-a="circ" data-w="${esc(p.w)}" style="animation-delay:${i*40}ms"><circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${col(K.words[p.w])}"/><text x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="central" font-size="${Math.max(8,Math.min(p.r*.45,p.r*3.1/p.w.length))}" style="fill:var(--ink)">${esc(p.w)}</text></g>`).join('')}</svg>`}
return `<h2>Gefühls-Wolke</h2><div class=card>${svg}<div id=det class=mu style="margin-top:10px">Tippe einen Kreis für Details. Orange = angenehm, blau = unangenehm, grün = neutral.</div></div>
<div class=card><div class=row><select data-i=cdays>${[[30,'30 Tage'],[90,'90 Tage'],[365,'Jahr'],[0,'Alles']].map(([v,l])=>`<option value=${v} ${cl.days==v?'selected':''}>${l}</option>`).join('')}</select><label class=row style="white-space:nowrap"><input type=checkbox data-i=ctw ${cl.tw?'checked':''}>Zeit-Gewichtung</label></div></div>`}
function detail(w){const es=Object.values(E).filter(e=>e.words.some(x=>x.w==w)),o=Object.values(E).filter(e=>!es.includes(e));
const tf=es.length>=3&&o.length>=3?AF().map(f=>{const a=es.map(e=>e.f[f.id]).filter(v=>v!=null),b=o.map(e=>e.f[f.id]).filter(v=>v!=null);return a.length>=3&&b.length>=3?{f,d:mean(a)-mean(b),s:sd(b)||1}:null}).filter(Boolean).sort((x,y)=>Math.abs(y.d/y.s)-Math.abs(x.d/x.s)).slice(0,3):[];
return `<b>${esc(w)}</b>: ${es.length}× genannt, zuletzt ${es.map(e=>e.date).sort().at(-1)}, Ø Stimmung ${mean(es.map(e=>e.mood)).toFixed(1)}`+(tf.length?`<br>Auffällig an diesen Tagen: ${tf.map(t=>esc(t.f.n)+(t.d>0?' ↑':' ↓')).join(', ')}`:'')}

/* Heute */
function vToday(){const known=Object.keys(K.words),cnt={};Object.values(E).forEach(e=>e.words.forEach(x=>cnt[x.w]=(cnt[x.w]||0)+1));known.sort((a,b)=>(cnt[b]||0)-(cnt[a]||0));
const old=Object.keys(E).length>3&&Date.now()-K.lastBackup>14*864e5;
const fr=f=>{const v=cur.f[f.id];return `<div class=fr>${esc(f.n)}${f.u?` <span class=mu>(${esc(f.u)})</span>`:''}`+(f.t=='n'?`<input type=number inputmode=decimal step=any value="${v??''}" data-i=fn data-f=${f.id}>`:`<div class=seg>${opts(f).map((l,i)=>{const val=f.t=='s'?i+1:i;return `<button class="${v===val?'on':''}" data-a=fv data-f=${f.id} data-v=${val}>${l}</button>`}).join('')}</div>`)+'</div>'};
return `<h2>Wie war dein Tag?</h2>${old?'<div class=warn>Dein letztes Backup ist über 14 Tage her. Unter „Mehr“ kannst du eins speichern.</div>':''}
<div class=card><input type=date value=${cur.date} max=${iso(new Date())} data-i=date></div>
<div class=card><h3>Gefühlswörter</h3><div class=row><input id=wi list=wl placeholder="Wort eingeben" enterkeyhint=done><datalist id=wl>${known.map(w=>`<option value="${esc(w)}">`).join('')}</datalist><button class=b data-a=addw>＋</button></div>
${pend?`<p>„${esc(pend)}“ ist neu. Wie fühlt es sich an?</p><div class=row>${[[-1,'unangenehm'],[0,'neutral'],[1,'angenehm']].map(([v,l])=>`<button class=b data-a=val data-v=${v}>${l}</button>`).join('')}</div>`:''}
<div class=chips>${known.map(w=>{const x=cur.words.find(x=>x.w==w);return `<button class="chip${x?' on':''}" style="--c:${col(K.words[w])}" data-a=chip data-w="${esc(w)}">${esc(w)}${x?' '+'●'.repeat(x.i):''}</button>`}).join('')}</div>
<p>Tippen wählt aus, erneut tippen erhöht die Intensität (●●●), danach wird das Wort entfernt.</p></div>
<div class=card><h3>Stimmung <span id=mv>${cur.mood}</span>/10</h3><input type=range min=1 max=10 value=${cur.mood} data-i=mood><h3 style="margin-top:14px">Energie <span id=ev>${cur.energy}</span>/5</h3><input type=range min=1 max=5 value=${cur.energy} data-i=energy></div>
<div class=card><h3>Einflussfaktoren</h3>${AF().map(fr).join('')}</div>
<div class=card><textarea rows=3 placeholder="Notiz (optional)" data-i=note>${esc(cur.note)}</textarea></div><button class="b p" data-a=save>Eintrag speichern</button>`}

/* Statistik */
function corr(lag,days){const es=ents(days);return AF().map(f=>{const x=[],y=[];es.forEach(e=>{const v=e.f[f.id],m=lag?E[addD(e.date,1)]?.mood:e.mood;if(v!=null&&m!=null)x.push(v),y.push(m)});if(x.length<5)return null;const r=pear(rank(x),rank(y)),bin=x.every(v=>v==0||v==1),md=bin?1:median(x),hi=y.filter((_,i)=>x[i]>=md),lo=y.filter((_,i)=>x[i]<md);let d=null;if(hi.length>1&&lo.length>1){const ps=Math.sqrt(((hi.length-1)*sd(hi)**2+(lo.length-1)*sd(lo)**2)/(hi.length+lo.length-2));d=ps?(mean(hi)-mean(lo))/ps:null}return{f,r,n:x.length,d,diff:hi.length&&lo.length?mean(hi)-mean(lo):null}}).filter(Boolean).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r))}
function line(es){if(es.length<2)return '<p>Für den Verlauf braucht es mindestens 2 Einträge.</p>';const W=340,H=150,p=20,t0=Date.parse(es[0].date),t1=Date.parse(es.at(-1).date),X=d=>p+(Date.parse(d)-t0)/(t1-t0||1)*(W-2*p),Y=m=>H-p-(m-1)/9*(H-2*p);
const ma=es.map(e=>mean(es.filter(o=>{const a=(Date.parse(e.date)-Date.parse(o.date))/864e5;return a>=0&&a<7}).map(o=>o.mood)));
return `<svg viewBox="0 0 ${W} ${H}">${[1,5,10].map(m=>`<line x1=${p} x2=${W-p} y1=${Y(m)} y2=${Y(m)} stroke="var(--ln)"/><text x=0 y=${Y(m)+4} font-size=10>${m}</text>`).join('')}${es.map(e=>`<circle cx=${X(e.date)} cy=${Y(e.mood)} r=3 fill="var(--mu)" opacity=.55 />`).join('')}<path fill=none stroke="var(--ac)" stroke-width=3 stroke-linejoin=round d="${es.map((e,i)=>(i?'L':'M')+X(e.date)+','+Y(ma[i])).join('')}"/></svg><p>Punkte: Tageswerte. Linie: gleitender 7-Tage-Durchschnitt.</p>`}
function vStats(){const es=ents(st.days),n=es.length,C=corr(st.lag,st.days),mx=Math.max(.3,...C.map(c=>Math.abs(c.r)));
const wd=[1,2,3,4,5,6,0].map(d=>{const a=es.filter(e=>new Date(e.date).getUTCDay()==d).map(e=>e.mood);return{l:'SoMoDiMiDoFrSa'.slice(d*2,d*2+2),v:a.length?mean(a):null}});
const W30=Object.fromEntries(weights(30,false).map(w=>[w.w,w.n])),Wp=Object.fromEntries(weights(60,false).map(w=>[w.w,w.n-(W30[w.w]||0)]));
const top=weights(st.days,false).sort((a,b)=>b.n-a.n).slice(0,8);
return `<h2>Statistik</h2><div class=card><div class=row><select data-i=sdays>${[[30,'30 Tage'],[90,'90 Tage'],[365,'Jahr'],[0,'Alles']].map(([v,l])=>`<option value=${v} ${st.days==v?'selected':''}>${l}</option>`).join('')}</select></div>${n<30?`<div class=warn>Nur ${n} Einträge im Zeitraum. Unter 20–30 Einträgen sind alle Aussagen noch sehr unsicher.</div>`:''}</div>
<div class=card><h3>Stimmungsverlauf</h3>${line(es)}</div>
<div class=card><h3>Nach Wochentag (Ø)</h3><svg viewBox="0 0 340 90">${wd.map((d,i)=>`<rect x=${i*48+8} y=${d.v?70-d.v*6:70} width=32 height=${d.v?d.v*6:0} rx=6 fill="var(--ac)" opacity=.8 /><text x=${i*48+24} y=86 font-size=11 text-anchor=middle>${d.l}</text>${d.v?`<text x=${i*48+24} y=${64-d.v*6} font-size=10 text-anchor=middle>${d.v.toFixed(1)}</text>`:''}`).join('')}</svg></div>
<div class=card><h3>Was beeinflusst meine Stimmung?</h3><label class=row><input type=checkbox data-i=slag ${st.lag?'checked':''}>Wirkung auf den Folgetag</label>
${C.length?C.map(c=>`<div class=bar><span>${esc(c.f.n)}</span><span style="display:flex;justify-content:${c.r<0?'flex-end':'flex-start'}"><i style="width:${Math.abs(c.r)/mx*100}%;background:${c.r>0?'var(--pos)':'var(--neg)'}"></i></span><span>ρ ${c.r.toFixed(2)}</span></div><div class=mu style="font-size:12px;margin:-4px 0 4px">n=${c.n}${c.diff!=null?` · Δ Stimmung ${c.diff>0?'+':''}${c.diff.toFixed(1)}`:''}${c.d!=null?` · d=${c.d.toFixed(2)}`:''}${c.n<20?' · sehr unsicher':''}</div>`).join(''):'<p>Noch zu wenige Daten (mind. 5 Tage mit Faktor und Stimmung).</p>'}
<p>ρ = Spearman-Korrelation (−1 bis +1). Orange: höhere Werte gehen mit besserer Stimmung einher, blau: mit schlechterer. d = Effektstärke (≈0,2 klein, 0,5 mittel, 0,8 groß).</p><div class=warn>Korrelation ist nicht Kausalität: Ein Zusammenhang zeigt nur, dass zwei Dinge gemeinsam auftreten. Das ist keine Diagnose und keine Therapieempfehlung.</div></div>
<div class=card><h3>Häufigste Wörter</h3>${top.map(w=>{const t=(W30[w.w]||0)-(Wp[w.w]||0);return `<div class=row style="justify-content:space-between;padding:4px 0"><span>${esc(w.w)}</span><span class=mu>${w.n}× ${t>0?'↑':t<0?'↓':'→'}</span></div>`}).join('')||'<p>Noch keine Wörter.</p>'}<p>Pfeil: letzte 30 Tage im Vergleich zu den 30 Tagen davor.</p></div>`}

/* Verlauf */
function vHist(){const hm=[],t=new Date(),start=addD(iso(t),-(t.getDay()+6)%7-14*7);for(let i=0;i<15*7;i++){const d=addD(start,i),e=E[d];hm.push(`<rect x=${Math.floor(i/7)*22} y=${i%7*22} width=18 height=18 rx=4 fill="${e?`hsl(${210-(e.mood-1)/9*175} 65% 55%)`:'var(--ln)'}" data-a=edit data-d=${d} />`)}
return `<h2>Verlauf</h2><div class=card><svg viewBox="0 0 330 154">${hm.join('')}</svg><p>Jedes Feld ist ein Tag (Spalten = Wochen). Blau = niedrige, Orange = hohe Stimmung.</p></div>
<div class=card>${ents(0).reverse().map(e=>`<div class=fr data-a=edit data-d=${e.date}><b>${e.date}</b> · Stimmung ${e.mood}<div class=mu>${e.words.map(x=>esc(x.w)).join(', ')}</div></div>`).join('')||'<p>Noch keine Einträge.</p>'}</div>`}

/* Einstellungen */
function vSet(){return `<h2>Einstellungen</h2><div class=card><h3>Wolke</h3>Halbwertszeit<select data-i=hl>${[[7,'7 Tage'],[30,'30 Tage'],[90,'90 Tage'],[0,'Aus']].map(([v,l])=>`<option value=${v} ${K.hl==v?'selected':''}>${l}</option>`).join('')}</select><p>Schwelle zum Ausblenden: ${K.thr}</p><input type=range min=0 max=3 step=.1 value=${K.thr} data-i=thr></div>
<div class=card><h3>Faktoren</h3>${[...F,...OPT,...K.custom].map(f=>`<label class=row style="padding:6px 0"><input type=checkbox data-a=hid data-f=${f.id} ${K.hidden.includes(f.id)?'':'checked'}>${esc(f.n)}</label>`).join('')}<br><button class=b data-a=cust>Eigenen Faktor anlegen</button></div>
<div class=card><h3>Backup</h3><p>iOS kann Browserdaten löschen. Sichere regelmäßig.</p><button class="b p" data-a=jex>JSON exportieren</button><br><br><button class=b data-a=cex style="width:100%">CSV exportieren</button><br><br><label class=b style="display:block;text-align:center">JSON importieren<input type=file accept=".json" data-i=imp hidden></label></div>
<div class=card><h3>Hinweise</h3><p>Erinnerungen: Push-Benachrichtigungen sind auf dem iPhone nur mit Server-Push möglich, daher bietet diese rein lokale App sie nicht an. Nutze stattdessen eine Erinnerung in der Kurzbefehle- oder Erinnerungen-App.</p><p>Die App liefert Muster, keine Diagnosen.</p></div>`}

function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('main').innerHTML={today:vToday,cloud:vCloud,stats:vStats,hist:vHist,set:vSet}[tab]()}
const A={tab:d=>{tab=d.t;if(tab=='today')cur=load(cur.date);render();scrollTo(0,0)},
addw(){const i=$('#wi'),w=i.value.trim();if(!w)return;const k=Object.keys(K.words).find(x=>x.toLowerCase()==w.toLowerCase());if(k)return A.chip({w:k});pend=w;render()},
async val(d){K.words[pend]=+d.v;if(!cur.words.some(x=>x.w==pend))cur.words.push({w:pend,i:1});pend=null;await saveK();render()},
chip(d){const x=cur.words.find(x=>x.w==d.w);if(!x)cur.words.push({w:d.w,i:1});else if(x.i<3)x.i++;else cur.words=cur.words.filter(y=>y!=x);render()},
fv(d){const v=+d.v;cur.f[d.f]===v?delete cur.f[d.f]:cur.f[d.f]=v;render()},
async save(){E[cur.date]=JSON.parse(JSON.stringify(cur));await putE(E[cur.date]);toast('Eintrag gespeichert ✓')},
edit(d){cur=load(d.d);tab='today';render();scrollTo(0,0)},
circ(d){$('#det').innerHTML=detail(d.w)},
async hid(d){const h=K.hidden;h.includes(d.f)?K.hidden=h.filter(x=>x!=d.f):h.push(d.f);await saveK()},
async cust(){const n=prompt('Name des Faktors');if(!n)return;const t=(prompt('Typ: j = Ja/Nein, s = Skala 1–5, z = Zahl','j')||'j')[0],u=t=='z'?prompt('Einheit (optional)')||'':'';K.custom.push({id:'x'+Date.now(),n,t:t=='s'?'s':t=='z'?'n':'b',u});await saveK();render()},
async jex(){dl('stimmung-backup.json',JSON.stringify({entries:Object.values(E),k:K}),'application/json');K.lastBackup=Date.now();await saveK()},
async cex(){const f=AF(),q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';dl('stimmung.csv',['Datum,Stimmung,Energie,Woerter,Notiz,'+f.map(x=>q(x.n)).join(',')].concat(ents(0).map(e=>[e.date,e.mood,e.energy,q(e.words.map(x=>x.w+':'+x.i).join('; ')),q(e.note),...f.map(x=>e.f[x.id]??'')].join(','))).join('\n'),'text/csv');K.lastBackup=Date.now();await saveK()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('input',async e=>{const t=e.target,i=t.dataset.i;if(!i)return;
if(i=='date'&&t.value){cur=load(t.value);render()}else if(i=='mood'){cur.mood=+t.value;$('#mv').textContent=t.value}else if(i=='energy'){cur.energy=+t.value;$('#ev').textContent=t.value}else if(i=='note')cur.note=t.value;
else if(i=='fn')t.value===''?delete cur.f[t.dataset.f]:cur.f[t.dataset.f]=+t.value;
else if(i=='cdays'){cl.days=+t.value;render()}else if(i=='ctw'){cl.tw=t.checked;render()}else if(i=='sdays'){st.days=+t.value;render()}else if(i=='slag'){st.lag=t.checked;render()}
else if(i=='hl'){K.hl=+t.value;await saveK()}else if(i=='thr'){K.thr=+t.value;await saveK();t.previousElementSibling.textContent='Schwelle zum Ausblenden: '+K.thr}
else if(i=='imp'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());for(const x of j.entries){E[x.date]=x;await putE(x)}K={...K,...j.k};await saveK();toast('Import erfolgreich ✓');render()}catch{toast('Datei ungültig')}}});
(async()=>{db=await new Promise(r=>{const q=indexedDB.open('stimmung',1);q.onupgradeneeded=()=>{q.result.createObjectStore('e',{keyPath:'date'});q.result.createObjectStore('k')};q.onsuccess=()=>r(q.result)});
(await req(tx('e').getAll())).forEach(e=>E[e.date]=e);K={...K,...(await req(tx('k').get('k')))};cur=load(iso(new Date()));render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});navigator.storage?.persist?.()})();
</script></body></html>
